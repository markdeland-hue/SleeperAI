<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Sleeper AI Draft</title><link rel="manifest" href="manifest.json">
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#0b1020}
*{box-sizing:border-box}body{margin:0;background:#0b1020;min-height:100vh}.wrap{max-width:680px;margin:auto;padding:20px 14px 35px}
.title{font-size:26px;font-weight:800;margin:5px 0}.small{font-size:12px;color:#94a3b8}.card{background:#151d2f;border:1px solid #26334d;border-radius:18px;padding:16px;margin:10px 0}
.clock{border-color:#16a34a;background:#10231a}.label{font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em}
.player{font-size:30px;font-weight:850;margin:5px 0}.pos{font-size:17px;color:#cbd5e1}.score{font-size:42px;font-weight:850}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0f172a;border-radius:12px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#94a3b8}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;font-size:15px;margin:7px 0}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;margin-top:7px}
table{width:100%;border-collapse:collapse}td{padding:9px 4px;border-bottom:1px solid #26334d;font-size:14px}td:last-child{text-align:right;font-weight:700}.error{color:#fca5a5}.green{color:#86efac}
</style></head><body><div class="wrap">
<div class="small">LIVE FANTASY FOOTBALL</div><div class="title">Sleeper AI Draft Assistant</div><div class="small">Team: mdeland</div>
<div class="card"><div class="label">Connect to Sleeper draft</div>
<input id="draft" placeholder="Paste Sleeper draft URL or ID"><button onclick="connect()">CONNECT</button>
<div id="status" class="small">No draft connected</div></div><div id="app"></div></div>
<script>
const API="https://api.sleeper.app/v1", USER="mdeland"; let ID=localStorage.getItem("draftId")||"";
const ADP={"Jahmyr Gibbs":1.7,"Bijan Robinson":1.5,"Ja'Marr Chase":3.4,"Puka Nacua":4,"Christian McCaffrey":6,"Jaxon Smith-Njigba":5,"Amon-Ra St. Brown":8,"CeeDee Lamb":14,"Justin Jefferson":13,"Malik Nabers":32,"Jonathan Taylor":18,"Saquon Barkley":12,"De'Von Achane":10,"Ashton Jeanty":15,"Derrick Henry":28,"Drake London":20,"Nico Collins":22,"Brian Thomas Jr.":30,"Trey McBride":20,"Brock Bowers":25,"Sam LaPorta":35,"Jalen Hurts":40,"Lamar Jackson":45,"Josh Allen":35,"Jayden Daniels":55};
const BASE={WR:84,RB:82,TE:74,QB:72,K:30,DEF:30};
const get=p=>fetch(API+p).then(r=>{if(!r.ok)throw Error("Sleeper API "+r.status);return r.json()});
const name=p=>p.full_name||((p.first_name||"")+" "+(p.last_name||"")).trim();
function parse(v){v=v.trim();let m=v.match(/sleeper\.app\/draft\/(?:nfl\/)?([0-9]+)/i);return m?m[1]:v.replace(/\D/g,"")}
function connect(){let x=parse(document.getElementById("draft").value);if(!x)return;ID=x;localStorage.setItem("draftId",x);refresh()}
function score(p,c,a,r,u){
 let s=BASE[p.pos]||40, ad=ADP[p.name]; if(ad!=null)s+=.42*Math.max(0,100-ad*.72);
 let t={QB:1,RB:2,WR:2,TE:1,K:1,DEF:1}[p.pos]||0;if((c[p.pos]||0)<t)s+=7;
 if(p.pos=="QB"&&r<=6&&!c.QB)s-=5;if((p.pos=="K"||p.pos=="DEF")&&r<12)s-=35;
 let n=a.filter(x=>x.pos==p.pos).length;if(n<=6)s+=12;else if(n<=10)s+=9;else if(n<=15)s+=5;else if(n<=25)s+=2;
 if(ad!=null){if(ad<=u+5)s+=5;if(ad>u+35)s-=4}if(p.pos=="QB"&&r<=5&&ad!=null&&ad>25)s-=10;
 return Math.max(0,Math.min(100,Math.round(s*10)/10))
}
async function refresh(){
 if(!ID){document.getElementById("app").innerHTML='<div class="card small">Paste your Sleeper draft link above.</div>';return}
 try{
  let [d,p,raw]=await Promise.all([get("/draft/"+ID),get("/draft/"+ID+"/picks"),get("/players/nfl")]);
  let [l,u,rs]=await Promise.all([get("/league/"+d.league_id),get("/league/"+d.league_id+"/users"),get("/league/"+d.league_id+"/rosters")]);
  let me=u.find(x=>(x.username||"").toLowerCase()==USER), mine=rs.find(x=>me&&x.owner_id==me.user_id);
  let picked=new Set(p.map(x=>String(x.player_id))), all=Object.entries(raw).map(([id,x])=>({id,name:name(x),pos:x.position,team:x.team||"FA"})).filter(x=>["QB","RB","WR","TE","K","DEF"].includes(x.pos));
  let a=all.filter(x=>!picked.has(x.id)), rosterIds=new Set((mine?.players||[]).map(String)), roster=all.filter(x=>rosterIds.has(x.id)), c={};roster.forEach(x=>c[x.pos]=(c[x.pos]||0)+1);
  let teams=Number(d.settings?.teams||l.total_rosters||12), next=p.length+1,r=Math.floor((next-1)/teams)+1,slot=(next-1)%teams;if(r%2==0)slot=teams-1-slot;
  let myslot=null;for(let [k,v] of Object.entries(d.draft_order||{}))if(mine&&String(v)==String(mine.roster_id))myslot=+k;
  let on=myslot!=null&&slot+1==myslot,u=teams;if(myslot!=null)u=on?0:(slot+1<myslot?myslot-slot-1:teams-slot-1+myslot);
  let ranked=a.map(x=>({p:x,s:score(x,c,a,r,u)})).sort((x,y)=>y.s-x.s),best=ranked[0];
  document.getElementById("draft").value=ID;document.getElementById("status").innerHTML='<span class="green">Connected</span> • '+d.status+' • '+ID;
  document.getElementById("app").innerHTML='<div class="card '+(on?"clock":"")+'"><div class="label">'+(on?"🟢 YOU ARE ON THE CLOCK":"⏳ WAITING")+' • Round '+r+'</div><div class="player">'+(best?.p.name||"No player")+'</div><div class="pos">'+(best?.p.pos||"")+' • '+(best?.p.team||"")+'</div><div class="score">'+(best?.s||0)+'<span style="font-size:16px"> / 100</span></div><div class="small">Market value + scarcity + roster need + draft timing + falling-player value.</div></div><div class="grid"><div class="stat"><b>'+p.length+'</b><span>PICKS MADE</span></div><div class="stat"><b>'+(u===0?"NOW":u)+'</b><span>UNTIL YOU PICK</span></div><div class="stat"><b>'+roster.length+'</b><span>YOUR PLAYERS</span></div></div><div class="card"><div class="label">Your roster</div>'+(roster.length?'<table>'+roster.map(x=>'<tr><td>'+x.pos+'</td><td>'+x.name+'</td></tr>').join("")+'</table>':'<div class="small">No picks yet.</div>')+'</div><div class="card"><div class="label">Top available</div><table>'+ranked.slice(0,10).map((x,i)=>'<tr><td>'+(i+1)+'. '+x.p.name+'</td><td>'+x.p.pos+' • '+x.s+'</td></tr>').join("")+'</table></div><button onclick="refresh()">↻ Refresh now</button>';
 }catch(e){document.getElementById("status").innerHTML='<span class="error">Connection failed</span>';document.getElementById("app").innerHTML='<div class="card error">'+e.message+'<div class="small">Check the draft URL/ID.</div></div>'}
}
document.getElementById("draft").value=ID;refresh();setInterval(refresh,10000);
</script></body></html>

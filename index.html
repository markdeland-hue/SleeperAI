<!doctype html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Sleeper AI Diagnostic</title>
<style>
body{margin:0;background:#0b1020;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:680px;margin:auto;padding:24px 14px 40px}.title{font-size:27px;font-weight:800}.small{color:#94a3b8;font-size:13px}
.card{background:#151d2f;border:1px solid #26334d;border-radius:18px;padding:16px;margin:12px 0}
input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;background:#0f172a;color:white;border:1px solid #334155;font-size:15px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#2563eb;color:white;font-weight:800;font-size:16px;margin-top:8px}
.row{padding:11px 0;border-bottom:1px solid #26334d}.ok{color:#86efac}.bad{color:#fca5a5}.wait{color:#fde68a}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;color:#cbd5e1}
</style></head><body><div class="wrap">
<div class="small">LIVE FANTASY FOOTBALL</div><div class="title">Sleeper AI Connection Test</div>
<div class="card"><div class="small">Sleeper draft URL or ID</div>
<input id="id" placeholder="https://sleeper.app/draft/nfl/...">
<button onclick="test()">TEST CONNECTION</button></div>
<div id="results"></div>
</div>
<script>
const API="https://api.sleeper.app/v1";
function parse(v){v=v.trim();let m=v.match(/sleeper\\.app\\/draft\\/(?:nfl\\/)?([0-9]+)/i);return m?m[1]:v.replace(/\\D/g,"")}
async function req(path){let t=performance.now();let r=await fetch(API+path,{cache:"no-store"});let txt=await r.text();let data;try{data=JSON.parse(txt)}catch{data=txt}return {ok:r.ok,status:r.status,ms:Math.round(performance.now()-t),data}}
function row(label,x){return `<div class="row"><b>${label}</b><br><span class="${x.ok?"ok":"bad"}">${x.ok?"✅ OK":"❌ FAILED"} — HTTP ${x.status} — ${x.ms}ms</span>${x.detail?`<div class="small">${x.detail}</div>`:""}</div>`}
async function test(){
 let id=parse(document.getElementById("id").value);
 if(!id){document.getElementById("results").innerHTML='<div class="card bad">Enter a Sleeper draft URL or ID.</div>';return}
 let out=`<div class="card"><div class="small">Testing draft ${id}…</div></div>`;document.getElementById("results").innerHTML=out;
 try{
  let d=await req("/draft/"+id);
  out+=row("1. Draft lookup",d);
  if(!d.ok){out+='<div class="card bad">The draft ID is not being found. Double-check that this is the active mock/real draft URL.</div>';document.getElementById("results").innerHTML=out;return}
  let leagueId=d.data.league_id;
  let p=await req("/draft/"+id+"/picks");out+=row("2. Draft picks",p);
  let l=await req("/league/"+leagueId);out+=row("3. League",l);
  let u=await req("/league/"+leagueId+"/users");out+=row("4. League users",u);
  let rs=await req("/league/"+leagueId+"/rosters");out+=row("5. Rosters",rs);
  let map=d.data.slot_to_roster_id||{};
  let me=u.ok?u.data.find(x=>(x.username||"").toLowerCase()==="mdeland"):null;
  let mine=rs.ok&&me?rs.data.find(x=>String(x.owner_id)===String(me.user_id)):null;
  out+=`<div class="card"><div class="row"><b>Draft ID</b><br>${id}</div><div class="row"><b>League ID</b><br>${leagueId||"none"}</div><div class="row"><b>Draft status</b><br>${d.data.status||"unknown"}</div><div class="row"><b>Picks currently recorded</b><br>${p.ok?p.data.length:"unknown"}</div><div class="row"><b>mdeland user found</b><br>${me?"✅ Yes":"❌ No"}</div><div class="row"><b>mdeland roster found</b><br>${mine?"✅ Roster "+mine.roster_id:"❌ No"}</div><div class="row"><b>slot_to_roster_id available</b><br>${Object.keys(map).length?"✅ Yes":"❌ No"}</div></div>`;
  if(p.ok&&p.data.length) out+=`<div class="card"><b>Latest picks</b><pre>${JSON.stringify(p.data.slice(-5),null,2)}</pre></div>`;
  document.getElementById("results").innerHTML=out;
 }catch(e){
  out+=`<div class="card bad"><b>Browser/API error</b><pre>${e.stack||e.message}</pre><p class="small">If this says Failed to fetch, the browser is blocking the direct API request and we'll need a proxy/backend.</p></div>`;
  document.getElementById("results").innerHTML=out;
 }
}
</script></body></html>
